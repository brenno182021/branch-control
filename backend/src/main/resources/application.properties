spring.application.name=branch-control
server.address=0.0.0.0
server.port=8087
server.error.include-message=never
spring.threads.virtual.enabled=false
spring.jackson.time-zone=America/Sao_Paulo
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/branch_control
spring.datasource.username=branch_control
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
branch-control.workspace-root=${BRANCH_CONTROL_WORKSPACE:./workspace}
branch-control.log-directory=${BRANCH_CONTROL_LOG_DIR:./data/logs}
branch-control.zone-id=${BRANCH_CONTROL_ZONE:America/Sao_Paulo}
branch-control.timeout-seconds=${BRANCH_CONTROL_GIT_TIMEOUT:90}
logging.file.name=${branch-control.log-directory}/application.log
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
spring.web.resources.cache.cachecontrol.no-store=true
server.forward-headers-strategy=none
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=BRANCHCONTROL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.sql.init.mode=never
