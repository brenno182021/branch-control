services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Defina PG_ADMIN_PASSWORD no arquivo .env}
      APP_DB_NAME: ${DB_NAME:-branch_control}
      APP_DB_USER: ${DB_USER:-branch_control}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/10-branch-control.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$APP_DB_USER -d $$APP_DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
