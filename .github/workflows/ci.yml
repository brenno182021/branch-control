name: Build e testes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: branch_control_test
          POSTGRES_USER: branch_control_test
          POSTGRES_PASSWORD: ci_disposable_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U branch_control_test -d branch_control_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/branch_control_test
      TEST_DB_USER: branch_control_test
      TEST_DB_PASSWORD: ci_disposable_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend e JAR
        run: bash compilar.sh
      - name: Testes PostgreSQL, autenticação e Git
        run: mvn -B -ntp -s config/maven-settings.xml -f backend/pom.xml test
